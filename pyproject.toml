[project]
name = "devdesk"
version = "0.1.0"
description = "Multi-agent RAG assistant: router + per-project specialist agents over VeriSim and Ares"
requires-python = ">=3.11"
dependencies = [
    "google-adk",
    "chromadb",
    "pyyaml",
    "tenacity",
    "python-dotenv",
    "langfuse>=2.60,<3",
    "fastapi",
    "uvicorn",
]

[project.scripts]
devdesk = "devdesk.cli:main"
devdesk-serve = "devdesk.server:main"

[project.optional-dependencies]
# Local MiniLM embedding fallback (pulls torch). Not needed when
# GOOGLE_API_KEY is set, so the server image leaves it out.
offline = [
    "sentence-transformers",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devdesk"]

# Only the offline MiniLM fallback (the `offline` extra) needs torch, and only on CPU (no GPU on
# this machine, and the default GPU wheels are several GB of unneeded CUDA
# libraries that made the initial install crawl).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: exercises a live LLM call, skipped without GOOGLE_API_KEY",
]
