# DevDesk eval set. Every expectation below was written by reading the
# indexed docs directly — nothing here is model-generated.
#
# Fields:
#   id                 stable key, used in result files and --ids filtering
#   split              dev (default) or holdout — see the held-out section below
#   question           asked verbatim
#   expected_agent     verisim | ares   -> router should call only that specialist
#                      cross            -> router should use search_all_projects
#                                          (or call every specialist)
#                      none             -> out of scope; routing isn't scored,
#                                          the answer must abstain (no citations)
#   expected_sources   source files (relative to the tenant's source_path) that
#                      count as a correct retrieval / citation; any one suffices
#   expected_keywords  case-insensitive strings a grounded answer must contain
#                      (end-to-end mode only); all must appear

- id: verisim-architecture
  question: "What is VeriSim's high-level architecture?"
  expected_agent: verisim
